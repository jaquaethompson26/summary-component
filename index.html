<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Ja'Quae Thompson">
    <meta name="description" content="This is summary component project using git and github as source control.">
    <title>Summary Component</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="summary">
        <h2>Summary</h2>
        <p>
            This component provides a brief overview of the content, giving the reader the most important information at
            a glance.
        </p>

        <a href="#" class="read-more">Read more</a>

        <div class="summary-details">
            <p>
                Additional information can be placed here. This content
                is hidden until the user chooses to read more.
            </p>
        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
